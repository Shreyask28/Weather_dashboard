<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <h1>Weather Dashboard</h1>
      <p>Search for any city to see current conditions and forecast</p>
      <button type="button" id="unit-toggle" class="unit-toggle">Switch to °F</button>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <form id="search-form" class="search-form">
        <input 
          type="text" 
          id="city-input" 
          placeholder="Enter city name (e.g., London, Tokyo, New York)" 
          autocomplete="off"
          required
        >
        <button type="submit" id="search-btn">Search</button>
        <button type="button" id="geo-btn" class="geo-btn" title="Use current location">📍 Location</button>
      </form>
    </section>

    <!-- Status Messages (Loading & Error) -->
    <div id="loading-spinner" class="status-msg hidden">
      <p>Fetching weather data...</p>
    </div>

    <div id="error-message" class="status-msg error-msg hidden">
      <!-- Error messages will appear here -->
    </div>

    <!-- Weather Display Area -->
    <main id="weather-display" class="weather-display hidden">
      <!-- Current Weather Card -->
      <section class="current-weather" id="current-weather">
        <h2 id="current-city">City Name</h2>
        <div class="current-details">
          <p class="temperature" id="current-temp">--°C</p>
          <p class="condition" id="current-condition">--</p>
          <p class="wind-speed">Wind Speed: <span id="current-wind">-- km/h</span></p>
        </div>
      </section>

      <!-- Multi-day Forecast Section -->
      <section class="forecast-section" id="forecast-section">
        <h3>Upcoming Forecast</h3>
        <div class="forecast-container" id="forecast-cards">
          <!-- Dynamic forecast cards generated by JavaScript will be placed here -->
        </div>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
